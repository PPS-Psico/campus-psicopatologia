name: Mantener despierto el proyecto Supabase del parcial

# Los proyectos del plan gratuito de Supabase se pausan tras 7 dias sin
# actividad. Las practicas por clase no consultan la API (las preguntas viven
# en el cliente), asi que sin este ping nada mantiene despierto el backend del
# parcial entre una clase y la evaluacion.
#
# Por que estos dos endpoints y no la raiz /rest/v1/: esa raiz devuelve
# "401 Secret API key required" y el rechazo ocurre en el gateway, sin llegar
# al proyecto. Serviria para un chequeo verde y enganoso. En cambio:
#   1. /rest/v1/rpc/keepalive ejecuta public.keepalive() dentro de Postgres y
#      devuelve la hora del servidor. Es una consulta real en la base, no una
#      peticion que resuelve el gateway, y es el chequeo que decide si el job
#      pasa o falla. La funcion la crea
#      supabase/migrations/20260906151630_add_keepalive_probe.sql y es inerte:
#      no lee ni escribe datos del parcial.
#   2. /functions/v1/exam-api ejecuta la Edge Function, que responde con su
#      propio JSON. Suma actividad de computo. Es best-effort: no hace fallar
#      el job, porque su respuesta depende de configuracion todavia pendiente
#      (las claves de Safe Exam Browser).
#
# La clave usada es la publishable, que ya es publica: esta en
# parcial/config.js y esta pensada para viajar al navegador. No hay secretos
# aca. Nunca pongas una clave secret o service_role en este archivo.

on:
  schedule:
    # Todos los dias 12:17 UTC (09:17 en Argentina). Diario y no cada 6 dias
    # para que un fallo aislado no consuma la ventana de 7 dias.
    - cron: "17 12 * * *"
  workflow_dispatch:

concurrency:
  group: keep-supabase-awake
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROJECT_REF: zprvefdhcxnivdgsbpkw
      PUBLISHABLE_KEY: sb_publishable_RH2Gj2j_K83BPWH_LX5I_w_9BsUT8ax
      APP_ORIGIN: https://pps-psico.github.io
    steps:
      - name: Consultar la base con public.keepalive()
        run: |
          set -euo pipefail
          url="https://${PROJECT_REF}.supabase.co/rest/v1/rpc/keepalive"
          echo "POST $url"
          code=$(curl -sS -o /tmp/keepalive.txt -w '%{http_code}' \
            --max-time 30 --retry 3 --retry-delay 15 --retry-connrefused \
            -X POST \
            -H "apikey: ${PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${PUBLISHABLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "$url")
          echo "HTTP $code"
          cat /tmp/keepalive.txt || true
          echo
          # Solo un 200 con la hora del servidor prueba que Postgres ejecuto la
          # consulta. Un proyecto pausado no resuelve el DNS; uno a medio
          # levantar devuelve 5xx (521 de Cloudflare o 502); un 404 significaria
          # que falta aplicar la migracion de la sonda.
          if [ "$code" != "200" ]; then
            echo "::error::La base no ejecuto public.keepalive() (HTTP $code). El proyecto puede estar pausado o caido, o falta aplicar 20260906151630_add_keepalive_probe.sql. Revisalo antes del parcial."
            exit 1
          fi
          echo "Postgres respondio: la base esta despierta."

      - name: Invocar la Edge Function
        continue-on-error: true
        run: |
          set -uo pipefail
          url="https://${PROJECT_REF}.supabase.co/functions/v1/exam-api"
          echo "POST $url"
          code=$(curl -sS -o /tmp/function.txt -w '%{http_code}' \
            --max-time 30 --retry 2 --retry-delay 10 \
            -X POST \
            -H "apikey: ${PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${PUBLISHABLE_KEY}" \
            -H "Origin: ${APP_ORIGIN}" \
            -H "Content-Type: application/json" \
            -d '{"action":"keepalive"}' \
            "$url") || code=000
          echo "HTTP $code"
          head -c 300 /tmp/function.txt || true
          echo
          echo "Informativo: la funcion respondio con su propio JSON, sin crear ningun intento."
