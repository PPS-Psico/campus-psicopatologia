<!--
  Recurso Etiqueta de Moodle. No requiere plugin ni permisos de administrador.
  Requiere que el filtro FilterCodes reemplace los valores entre llaves.
  Ajustar data-exam-id y data-app-url antes de publicar.
-->
<div
  id="psicoparcial-launcher"
  data-course-id="{courseid}"
  data-moodle-user-id="{userid}"
  data-moodle-username="{username}"
  data-firstname="{firstname}"
  data-lastname="{lastname}"
  data-exam-id="11111111-1111-4111-8111-111111111111"
  data-app-url="https://pps-psico.github.io/campus-psicopatologia/parcial/index.html"
>
  <iframe
    id="psicoparcial-frame"
    title="Primer parcial de Psicopatología I"
    src="https://pps-psico.github.io/campus-psicopatologia/parcial/index.html"
    style="display:block;width:100%;height:max(820px,100vh);border:0;background:#f8fafc"
    sandbox="allow-scripts allow-forms allow-same-origin"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>
</div>
<script>
(function () {
  'use strict';
  var root = document.getElementById('psicoparcial-launcher');
  var frame = document.getElementById('psicoparcial-frame');
  if (!root || !frame) return;

  var examId = root.dataset.examId;
  var appUrl = new URL(root.dataset.appUrl);
  var appOrigin = appUrl.origin;
  var pending = new Set();
  var context = {
    courseId: root.dataset.courseId || '',
    moodleUserId: root.dataset.moodleUserId || '',
    moodleUsername: root.dataset.moodleUsername || '',
    firstname: root.dataset.firstname || '',
    lastname: root.dataset.lastname || ''
  };

  function unresolved(value) {
    return !value || value.indexOf('{') !== -1 || value.indexOf('}') !== -1;
  }

  function contextIsValid() {
    return /^\d+$/.test(context.courseId)
      && /^\d+$/.test(context.moodleUserId)
      && !unresolved(context.moodleUsername)
      && !unresolved(context.firstname)
      && !unresolved(context.lastname);
  }

  frame.src = appUrl.href;

  window.addEventListener('message', function (event) {
    if (event.origin !== appOrigin || event.source !== frame.contentWindow) return;
    var data = event.data;
    if (!data || data.type !== 'PSICOPARCIAL_CONTEXT_REQUEST' || data.version !== 1) return;
    if (typeof data.requestId !== 'string' || data.examId !== examId || pending.has(data.requestId)) return;
    pending.add(data.requestId);

    var response = {
      type: 'PSICOPARCIAL_CONTEXT_RESULT',
      version: 1,
      requestId: data.requestId,
      ok: contextIsValid()
    };

    if (response.ok) response.context = context;
    else response.error = 'moodle_context_failed';

    pending.delete(data.requestId);
    frame.contentWindow.postMessage(response, appOrigin);
  });
})();
</script>
