<!--
  Pegar el bloque completo desde el editor HTML de Moodle.
-->
<div id="psi-campus-frame-wrap" style="width:100%;max-width:1100px;margin:0 auto;">
  <iframe
    id="psi-campus-frame"
    src="https://pps-psico.github.io/campus-psicopatologia/inicio.html"
    title="Inicio de Psicopatología I"
    scrolling="no"
    allow="fullscreen"
    loading="eager"
    style="width:100%;height:820px;border:0;display:block;background:transparent;"
  ></iframe>
</div>
<script>
  (function () {
    "use strict";
    var frame = document.getElementById("psi-campus-frame");

    window.addEventListener("message", function (event) {
      var data = event.data;
      if (!frame || event.source !== frame.contentWindow) return;
      if (!data || data.psiCampus !== true || data.source !== "campus-psicopatologia-i") return;
      if (typeof data.height !== "number" || data.height < 200 || data.height > 4000) return;
      frame.style.height = Math.ceil(data.height + 2) + "px";
    });
  }());
</script>
