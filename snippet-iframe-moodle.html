<div id="psi-aula-embed">
  <iframe
    id="psi-aula-frame"
    src="https://pps-psico.github.io/campus-psicopatologia/inicio.html?v=4"
    title="Aula de Psicopatología I | Comisión 3 | Turno mañana"
    loading="eager"
    scrolling="auto"
    allowtransparency="true"
    allow="fullscreen"
  ></iframe>
</div>

<script>
  (function () {
    "use strict";

    var frame = document.getElementById("psi-aula-frame");
    if (!frame) return;

    function esEstudiante() {
      var body = document.body;
      if (body.classList.contains("userswitchedrole")) return true;

      var nav = document.querySelector(
        '.secondary-navigation, nav.secondary-navigation, [data-region="secondary-navigation"]'
      );

      if (!nav) return false;

      if (
        nav.querySelector(
          'a[href*="course/edit.php"], a[href*="/admin/roles"], a[href*="/group/index.php"], a[href*="report/"], a[href*="enrol/"]'
        )
      ) {
        return false;
      }

      var texto = (nav.textContent || "").toLowerCase();
      if (
        texto.indexOf("configuraci") > -1 ||
        texto.indexOf("settings") > -1 ||
        texto.indexOf("ajustes") > -1
      ) {
        return false;
      }

      return true;
    }

    function aplicarRol() {
      if (esEstudiante()) {
        document.body.classList.add("psi-rol-estudiante");
      } else {
        document.body.classList.remove("psi-rol-estudiante");
      }
    }

    function cerrarCajones() {
      [
        "drawer-open-blocks",
        "drawer-open-right",
        "show-drawer-blocks",
        "show-drawer-right",
        "drawer-open-index",
        "show-drawer-left"
      ].forEach(function (clase) {
        document.body.classList.remove(clase);
        var pagina = document.getElementById("page");
        if (pagina) pagina.classList.remove(clase);
      });

      [
        "theme_boost-drawers-blocks",
        "theme_boost-drawers-courseindex"
      ].forEach(function (id) {
        var cajon = document.getElementById(id);
        if (!cajon) return;
        cajon.classList.remove("show");
        cajon.setAttribute("aria-hidden", "true");
        var boton = cajon.querySelector('[data-action="closedrawer"]');
        if (boton) boton.click();
      });
    }

    window.addEventListener("message", function (event) {
      var data = event.data;

      if (event.source !== frame.contentWindow) return;
      if (event.origin !== "https://pps-psico.github.io") return;
      if (!data || data.psiCampus !== true) return;
      if (data.source !== "campus-psicopatologia-i") return;
      if (typeof data.height !== "number") return;
      if (data.height < 200 || data.height > 4000) return;

      frame.style.height = Math.ceil(data.height + 2) + "px";
    });

    aplicarRol();
    cerrarCajones();

    window.addEventListener("load", function () {
      aplicarRol();
      cerrarCajones();
    });

    setTimeout(aplicarRol, 300);
    setTimeout(aplicarRol, 800);
    setTimeout(aplicarRol, 1500);
    setTimeout(cerrarCajones, 500);
    setTimeout(cerrarCajones, 1500);
  }());
</script>
