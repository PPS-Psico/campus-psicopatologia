<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vista previa Moodle | Psicopatología I</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }
    body {
      background: #eef1f2;
      color: #263238;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 28px 18px 48px;
    }
    .preview-shell {
      margin: 0 auto;
      max-width: 930px;
    }
    .preview-label {
      color: #647176;
      font-size: 13px;
      font-weight: 600;
      margin: 0 0 10px;
    }
    .preview-content {
      background: #ffffff;
      border: 1px solid #dfe4e6;
      border-radius: 8px;
      box-shadow: 0 8px 28px rgba(38, 50, 56, 0.08);
      padding: 26px;
    }
    iframe {
      background: transparent;
      border: 0;
      display: block;
      height: 820px;
      width: 100%;
    }
    @media (max-width: 620px) {
      body { padding: 0; }
      .preview-label { display: none; }
      .preview-content { border: 0; border-radius: 0; padding: 0; }
    }
  </style>
</head>
<body>
  <main class="preview-shell">
    <p class="preview-label">Vista previa dentro del área central de Moodle</p>
    <div class="preview-content">
      <iframe id="psi-campus-frame" src="inicio.html" title="Inicio de Psicopatología I" scrolling="no" allow="fullscreen"></iframe>
    </div>
  </main>
  <script>
    (function () {
      "use strict";
      var frame = document.getElementById("psi-campus-frame");
      window.addEventListener("message", function (event) {
        var data = event.data;
        if (!frame || event.source !== frame.contentWindow) return;
        if (!data || data.psiCampus !== true || data.source !== "campus-psicopatologia-i") return;
        if (typeof data.height !== "number" || data.height < 200 || data.height > 4000) return;
        frame.style.height = Math.ceil(data.height + 2) + "px";
      });
    }());
  </script>
</body>
</html>
